import = [
   "~/.config/alacritty/alacritty-theme/themes/Cobalt2.toml"
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.7

[font]
size = 10.5

[font.bold]
family = "SpaceMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "SpaceMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "SpaceMono Nerd Font Mono"
style = "Italic"

[font.normal]
family = "SpaceMono Nerd Font Mono"
style = "Regular"
